apiVersion: v1
kind: Pod
metadata:
  name: oom-demo
spec:
  containers:
    - name: memory-consumer
      image: python:3.12-alpine
      command: ["python", "-c"]
      args:
        - |
          import time
          blocks = []
          while True:
              blocks.append(bytearray(10 * 1024 * 1024))
              print(f"allocated approximately {len(blocks) * 10} MiB", flush=True)
              time.sleep(0.5)
      resources:
        requests:
          memory: "16Mi"
        limits:
          memory: "64Mi"
