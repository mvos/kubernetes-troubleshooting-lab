apiVersion: v1
kind: Pod
metadata:
  name: crashloop-demo
  labels:
    app: crashloop-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - echo "Starting application";
          echo "ERROR: required configuration APP_MODE is missing";
          exit 1
      env:
        - name: APP_MODE
          value: ""
